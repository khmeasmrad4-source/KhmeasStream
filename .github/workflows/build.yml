name: Build KHMEAS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      
      - name: Setup Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform
      
      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug
        continue-on-error: false
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KHMEAS-APK
          path: bin/*.apk
          if-no-files-found: error
